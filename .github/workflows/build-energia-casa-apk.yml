name: Build Energia Casa APK

on:
  push:
    branches:
      - build/energia-casa-apk
    paths:
      - 'energia-casa-apk/**'
      - '.github/workflows/build-energia-casa-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: energia-casa-apk
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p out
          cp energia-casa-apk/app/build/outputs/apk/debug/app-debug.apk out/EnergiaCasa.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnergiaCasa-APK
          path: out/EnergiaCasa.apk
          if-no-files-found: error
